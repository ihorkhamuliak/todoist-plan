; Plan of the day: Todoist overdue + today + 3 days. Text is written by "todo.py widget".
; ASCII only on purpose: Rainmeter misreads UTF-8 skins, so Cyrillic patterns use \x{...} codes.
; Toggle: a Start Menu shortcut with a hotkey runs  Rainmeter.exe !ToggleConfig "PlanDay" "PlanDay.ini"

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=PlanDay
Information=Todoist plan on the desktop. Click opens the Todoist app on Today.
License=MIT

[Variables]
@Include=#@#paths.inc

; --- refresh: run todo.py on load and every 5 minutes, then re-read the text file
[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % 300) + 1
IfEqualValue=1
IfEqualAction=[!CommandMeasure MeasureRun "Run"]

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program="#Python#"
Parameter=""#Script#" widget"
State=Hide
Timeout=60000
FinishAction=[!CommandMeasure MeasureFile "Update"]

[MeasureFile]
Measure=WebParser
URL=file://#TextFile#
CodePage=1200
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=300
FinishAction=[!UpdateMeter *][!Redraw]

; --- look
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,[MeterText:W],[MeterText:H],10 | Fill Color 18,20,26,215 | StrokeWidth 0
DynamicVariables=1

[MeterText]
Meter=String
MeasureName=MeasureFile
W=380
Padding=14,12,14,12
FontFace=Segoe UI
FontSize=10
FontColor=228,230,236
AntiAlias=1
ClipString=2
Text=%1
; headers: overdue, today, "MON 05.10" style day lines (uppercase Cyrillic for uk, uppercase Latin for en)
InlineSetting=Weight | 700
InlinePattern=(?m)^(?:[\x{0400}-\x{042F}][\x{0400}-\x{042F} .0-9]*|OVERDUE|TODAY|[A-Z]{3} \d\d\.\d\d)$
InlineSetting2=Color | 140,190,255
InlinePattern2=(?m)^(?:[\x{0400}-\x{042F}][\x{0400}-\x{042F} .0-9]*|OVERDUE|TODAY|[A-Z]{3} \d\d\.\d\d)$
; overdue header and "-3 days" tail in red
InlineSetting3=Color | 255,95,95
InlinePattern3=(?m)^(?:\x{041F}\x{0420}\x{041E}\x{0421}\x{0422}\x{0420}\x{041E}\x{0427}\x{0415}\x{041D}\x{0415}|OVERDUE)$
InlineSetting4=Color | 255,95,95
InlinePattern4=\x{2212}\d+ (?:\x{0434}\x{043D}|d)
; priority bullets: P1 red, P2 orange, P3 blue
InlineSetting5=Color | 255,80,80
InlinePattern5=\x{25CF}
InlineSetting6=Color | 255,165,40
InlinePattern6=\x{25D0}
InlineSetting7=Color | 90,160,255
InlinePattern7=\x{25CB}
; footer grey ("closed today: N, no date: N, updated"), warning yellow
InlineSetting8=Color | 135,138,148
InlinePattern8=(?m)^(?:\x{0437}\x{0430}\x{043A}\x{0440}\x{0438}\x{0442}\x{043E} |\x{0431}\x{0435}\x{0437} |closed today|no date).*$
InlineSetting9=Color | 255,205,60
InlinePattern9=(?m)^\x{26A0}.*$
; personal "BAZOVE: ..." line (habits, bills) in soft green
InlineSetting10=Color | 130,215,150
InlinePattern10=(?m)^(?:\x{0411}\x{0410}\x{0417}\x{041E}\x{0412}\x{0415}|ESSENTIALS):.*$
LeftMouseUpAction=["todoist://today"]
ToolTipText=Click: open Todoist app (Today)
